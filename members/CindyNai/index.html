<!DOCTYPE html><html lang="zh-CN"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>奈的小窝</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; } .card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; animation: float 3s ease-in-out infinite; } @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } } .avatar { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 50px; } h1 { color: #333; margin-bottom: 10px; font-size: 28px; } .intro { color: #666; font-size: 16px; line-height: 1.8; margin-bottom: 20px; } .tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; } .tag { background: #fff0f0; color: #ff6b6b; padding: 6px 16px; border-radius: 20px; font-size: 14px; } </style></head><body> <div class="card"> <div class="avatar">🍙</div> <h1>你好，我是奈</h1> <p class="intro"> 我喜欢吃饭 🍚<br> 我要学AI 🤖 </p> <div class="tags"> <span class="tag">干饭人</span> <span class="tag">AI新手</span> <span class="tag">全栈开发中</span> </div> </div></body></html>
